# lefthook.yml — Enforces version-prefixed commits + auto-bump after every commit
#
# Amend-safe: post-commit derives next version from HEAD's message (not blind bump),
# so amending keeps pkg consistent. Package paths live in .lefthook/version-files.jsonc.
#
# Hook execution order (Git/lefthook):
#   1. commit-msg   → enforce-version-prefix (validates format + pkg match, allows amend)
#   2. post-commit  → auto-version-bump (sets pkg = HEAD message version + 1)
#   3. pre-push     → version-consistency (ensures pkg == last-commit + 1, or == on amend)

commit-msg:
  scripts:
    "enforce-version-prefix.nu":
      runner: nu

post-commit:
  commands:
    "auto-version-bump":
      run: bun run .lefthook/scripts/version-bump.ts

pre-push:
  commands:
    "version-consistency":
      run: bun run .lefthook/scripts/version-check.ts


pre-commit:
    commands:
      "filesize-check":
        run: bun run .lefthook/scripts/filesize-check.ts {staged_files}
